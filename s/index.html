<title>코칭 스터디룸</title>
<script>
/* 짧은 주소 → 코칭 스터디룸 (2026-11-16). 카카오톡 안(인앱 브라우저)에서 열면 카카오톡의 '외부 브라우저로 열기'로 넘김 */
(function(){
  var target = 'https://coaching-english.github.io/?p=lec';
  var ua = navigator.userAgent || '';

  } else {
    location.replace(target);
  }
})();
</script>
