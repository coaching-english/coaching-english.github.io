<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코칭잉글리쉬</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-32.png"><link rel="apple-touch-icon" href="icon-180.png"><meta name="theme-color" content="#1f2a5c">
<style>body{font-family:sans-serif;color:#202124;background:#f5f6fa;padding:40px 16px;text-align:center}
.tmr{display:inline-block;padding:12px;border-radius:34px;background:linear-gradient(145deg,#fff,#e9ebe6);box-shadow:0 6px 18px rgba(0,0,0,.14)}.tmr .scr{width:168px;height:168px;border-radius:26px;background:radial-gradient(circle at 50% 40%,#1b1d22,#050506 70%)}.tmr svg{display:block;width:100%;height:100%}.dg{font-family:'Orbitron',ui-monospace,monospace;font-weight:600}.tmr.ov .num{animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:.35}}#msg{color:#5f6368}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap">
</head>
<body>
<div class="tmr" id="tm"><div class="scr" id="tsc"></div></div><p id="msg">코칭잉글리쉬 불러오는 중…</p>
<script>
/* 코칭잉글리쉬 바깥 주소 — Code.js [63] (99C 바깥주소와 같은 방식).
   구글 계정 정보 없이(credentials omit) 웹앱 화면을 받아 띄우고, google.script.run · url · history 를 대신 만든다.
   주소 뒤 ?p=lec 등은 그대로 웹앱에 넘긴다. 웹앱 주소가 바뀌면 EXEC 만 고친다. 이 파일엔 코드·학생 정보가 없다. */
var EXEC = 'https://script.google.com/macros/s/AKfycbwhsDB30ymb1nHOWs00DpQA8qTBrxJWJFzJ9EGL0OV_4EnJVAMmL8dx81EL8fNGHG4/exec';
var HERE = location.origin + location.pathname;
var TITLES = { track: '코칭 트랙 수강 신청', lec: '코칭 스터디룸', board: '코칭잉글리쉬 현황판', status: '코칭잉글리쉬 현황판', self: '코칭잉글리쉬 할 일 체크',
  boss: '코칭 원장', tools: '코칭 분석', admin: '코칭 관리', work: '코칭 채점쌤', grade: '코칭 채점쌤' };

function rpcRunner(ok, bad) {
  return new Proxy({}, { get: function (t, name) {
    if (name === 'withSuccessHandler') return function (f) { return rpcRunner(f, bad); };
    if (name === 'withFailureHandler') return function (f) { return rpcRunner(ok, f); };
    if (name === 'withUserObject') return function () { return rpcRunner(ok, bad); };
    return function () {
      var args = Array.prototype.slice.call(arguments);
      fetch(EXEC, { method: 'POST', credentials: 'omit', body: JSON.stringify({ kind: 'rpc', fn: name, args: args }) })
        .then(function (r) { return r.text(); })
        .then(function (t) {   // 서버가 돌려준 앱 주소(관리앱·채점앱·현황판 링크)도 바깥 주소로. 센터 PC·문자 연결 설정(bankSetup)은 진짜 주소 그대로
          var x = JSON.parse(name === 'api' && args[1] === 'bankSetup' ? t : t.split(EXEC).join(HERE)); if (x && x.ok) { if (ok) ok(x.r); } else if (bad) bad(new Error((x && (x.error || x.msg)) || '서버 오류')); })
        .catch(function () { if (bad) bad(new Error('')); });   // 이유가 비면 앱(API_ERR)이 '연결 끊김' 안내
    };
  } });
}
window.google = { script: {
  run: rpcRunner(null, null),
  url: { getLocation: function (cb) {
    var q = {}, qs = {};
    new URLSearchParams(location.search).forEach(function (v, k) { q[k] = v; (qs[k] = qs[k] || []).push(v); });
    setTimeout(function () { cb({ parameter: q, parameters: qs, hash: location.hash.replace(/^#/, '') }); }, 0);
  } },
  history: {
    push: function (st) { history.pushState(st || null, ''); },
    replace: function (st) { history.replaceState(st || null, ''); },
    setChangeHandler: function (f) { addEventListener('popstate', function (e) { f({ state: e.state, location: {} }); }); }
  },
  host: { close: function () {}, setHeight: function () {}, setWidth: function () {}, editor: {} }
} };

/* ⏳ 화면 받는 동안 남은 시간 (2026-11-21) — 이 기기에서 지난 5번 걸린 시간 평균으로 어림 (localStorage outWait) */
var W_T0 = Date.now(), W_EST = 6;
try { var W_A = JSON.parse(localStorage.getItem('outWait') || '[]'); if (W_A.length) W_EST = Math.max(1, W_A.reduce(function (a, b) { return a + b; }, 0) / W_A.length); } catch (e) {}
(function () {                                                        // 타이머 모양 — 강의.html waitFace와 같음
  var t = '', D = Math.max(4, Math.ceil(W_EST));
  for (var i = 0; i < 60; i++) { var a = i * Math.PI / 30;
    t += '<line data-i="' + i + '" x1="' + (100 + 70 * Math.sin(a)).toFixed(1) + '" y1="' + (100 - 70 * Math.cos(a)).toFixed(1) + '" x2="' + (100 + 82 * Math.sin(a)).toFixed(1) + '" y2="' + (100 - 82 * Math.cos(a)).toFixed(1) + '" stroke="#2a2d33" stroke-width="' + (i % 5 ? 3 : 4.5) + '" stroke-linecap="round"/>'; }
  for (var k = 0; k < 4; k++) { var b = k * Math.PI / 2;
    t += '<text x="' + (100 + 92 * Math.sin(b)).toFixed(1) + '" y="' + (103 - 92 * Math.cos(b)).toFixed(1) + '" text-anchor="middle" font-size="9" fill="#6b7078" class="dg">' + Math.round(D * k / 4) + '</text>'; }
  document.getElementById('tsc').innerHTML = '<svg viewBox="0 0 200 200">' + t + '<text x="100" y="78" text-anchor="middle" font-size="10" fill="#8a8f98" id="tst">남은 시간</text>' +
    '<text x="100" y="116" text-anchor="middle" font-size="36" fill="#eceef4" class="dg num" id="tnum">0:00</text><text x="100" y="138" text-anchor="middle" font-size="10" fill="#9b8cf0" id="tlb"></text></svg>';
})();
function wPaint() {
  var s = (Date.now() - W_T0) / 1000, rem = Math.max(0, W_EST - s), over = rem <= 0, D = Math.max(4, Math.ceil(W_EST)), lit = Math.ceil(rem / D * 60), spin = Math.floor(s * 6) % 60;
  var col = rem > W_EST * .5 ? '#9b8cf0' : rem > W_EST * .2 ? '#f2b35b' : '#ef6b6b';
  [].forEach.call(document.querySelectorAll('#tsc line'), function (l) { var i = +l.getAttribute('data-i');
    l.setAttribute('stroke', over ? (i === spin || i === (spin + 59) % 60 ? '#9b8cf0' : '#2a2d33') : i < lit ? col : '#2a2d33'); });
  var sec = over ? 0 : Math.ceil(rem);
  document.getElementById('tnum').textContent = Math.floor(sec / 60) + ':' + ('0' + sec % 60).slice(-2);
  document.getElementById('tst').textContent = over ? '조금만 더' : '남은 시간';
  document.getElementById('tlb').textContent = over ? (s < W_EST * 2 ? '거의 다 됐어요' : '조금 더 걸리고 있어요 · ' + Math.round(s) + '초') : '약 ' + Math.ceil(rem) + '초';
  document.getElementById('tm').classList.toggle('ov', over);
}
wPaint(); var W_IV = setInterval(wPaint, 250);
function wDone(ok) {
  clearInterval(W_IV); var s = (Date.now() - W_T0) / 1000;
  if (ok && s < 60) try { var a = JSON.parse(localStorage.getItem('outWait') || '[]'); a.push(Math.round(s * 10) / 10); localStorage.setItem('outWait', JSON.stringify(a.slice(-5))); } catch (e) {}
}
var qs = new URLSearchParams(location.search); qs.set('raw', '1');
fetch(EXEC + '?' + qs.toString(), { credentials: 'omit' })
  .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(function (html) {
    if (html.indexOf('<') < 0) throw new Error('화면이 아님');
    html = html.split(EXEC).join(HERE);   // 앱 이동 줄·새로고침 주소를 바깥 주소로
    var title = TITLES[new URLSearchParams(location.search).get('p') || ''] || '코칭잉글리쉬';
    var IC = ({ admin: '-admin', grade: '-grade', work: '-grade', tools: '-tools', boss: '-boss' })[new URLSearchParams(location.search).get('p') || ''] || '';   // 앱마다 홈 화면 아이콘 (2026-11-14): 관리 ADMIN · 채점쌤(채점+근무) · 분석 · 원장 · 스터디룸
    var head = '<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>' + title + '</title>' +
      '<link rel="manifest" href="manifest' + (IC || (new URLSearchParams(location.search).get('p') === 'lec' ? '-lec' : '')) + '.json"><link rel="icon" href="icon' + IC + '-32.png"><link rel="apple-touch-icon" href="icon' + IC + '-180.png"><meta name="theme-color" content="#1f2a5c">';
    html = /<head>/i.test(html) ? html.replace(/<head>/i, '<head>' + head) : '<!DOCTYPE html><html><head>' + head + '</head><body>' + html + '</body></html>';
    wDone(true);
    document.open(); document.write(html); document.close();
  })
  .catch(function (e) {
    wDone(false); var tm = document.getElementById('tm'); if (tm) tm.style.display = 'none';
    document.getElementById('msg').textContent = '화면을 불러오지 못했어요 (' + e.message + '). 인터넷 연결을 확인하고 새로고침해 주세요.';
  });
</script>
</body>
